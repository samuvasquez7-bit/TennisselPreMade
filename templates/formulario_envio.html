<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos de Envío | TENNISSEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.1">
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Montserrat', sans-serif; }
        .envio-page { padding: 60px 0; }
        .envio-container { max-width: 600px; margin: 0 auto; padding: 0 20px; }
        .envio-panel { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .envio-header { margin-bottom: 25px; text-align: center; }
        .envio-header h1 span { color: #00ff66; }
        .form-label { color: #aaa; font-weight: 500; }
        .form-control { background: #222; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 6px; }
        .form-control:focus { background: #222; border-color: #00ff66; color: #fff; box-shadow: 0 0 0 0.25rem rgba(0, 255, 102, 0.25); }
        .btn-continuar { width: 100%; background: #00ff66; color: #000; font-weight: bold; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 20px; transition: 0.2s; }
        .btn-continuar:hover { background: #00cc52; }
    </style>
</head>
<body>

{% include 'navbar.html' %}

<main class="envio-page">
    <div class="envio-container">
        <div class="envio-panel">
            <div class="envio-header">
                <h1><i class="fas fa-shipping-fast" style="color: #00ff66;"></i> Dirección de <span>Envío</span></h1>
                <p style="color: #aaa;">¿A dónde enviaremos tu equipamiento?</p>
            </div>

            <form action="{{ url_for('formulario_envio') }}" method="POST">
                <div class="mb-3">
                    <label for="direccion" class="form-label">Dirección exacta</label>
                    <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Ej: Calle 123 # 45-67, Apto 201" required>
                </div>

                <div class="mb-3">
                    <label for="ciudad" class="form-label">Ciudad</label>
                    <input type="text" class="form-control" id="ciudad" name="ciudad" placeholder="Ej: Bogotá, Medellín, Cali..." required>
                </div>

                <div class="mb-4">
                    <label for="telefono" class="form-label">Teléfono de contacto</label>
                    <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ej: 3001234567" required>
                </div>

                <button type="submit" class="btn-continuar">
                    Continuar al Pago <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </form>
        </div>
    </div>
</main>

{% include 'footer.html' %}
</body>
</html>
