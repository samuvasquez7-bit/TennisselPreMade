<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - TENNISSEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { background-color: #0d1117; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
        .recovery-card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 30px; max-width: 450px; margin: 80px auto; }
        .btn-primary-custom { background: #00ff66; color: #000; font-weight: bold; width: 100%; border: none; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    {% include 'navbar.html' %}

    <div class="recovery-card">
        <h3 class="text-center fw-bold mb-3">RECUPERAR <span style="color:#00ff66;">CUENTA</span></h3>
        <p class="text-secondary text-center small mb-4">Ingresa tu correo y te enviaremos las instrucciones para restablecer tu contraseña.</p>

        <form action="{{ url_for('recuperar_password') }}" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label text-light small">Correo Electrónico</label>
                <input type="email" class="form-control bg-dark text-light border-secondary" id="email" name="email" required placeholder="correo@ejemplo.com">
            </div>
            <button type="submit" class="btn-primary-custom mt-2">Enviar Correo</button>
        </form>
    </div>

    {% include 'footer.html' %}
</body>
</html>
