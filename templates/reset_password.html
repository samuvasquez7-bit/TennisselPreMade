<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - TENNISSEL</title>
    
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilo personalizado de tu app -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        body { 
            background-color: #0d1117; 
            color: #ffffff; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }
        .reset-card { 
            background: #161b22; 
            border: 1px solid #21262d; 
            border-radius: 12px; 
            padding: 35px; 
            width: 100%;
            max-width: 450px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .btn-primary-custom { 
            background: #00ff66; 
            color: #000000; 
            font-weight: bold; 
            width: 100%; 
            border: none; 
            padding: 12px; 
            border-radius: 6px; 
            transition: all 0.3s ease;
        }
        .btn-primary-custom:hover {
            background: #00cc52;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }
    </style>
</head>
<body>

    {% include 'navbar.html' %}

    <div class="main-container">
        <div class="reset-card">
            <h3 class="text-center fw-bold mb-2">NUEVA <span style="color:#00ff66;">CONTRASEÑA</span></h3>
            <p class="text-secondary text-center small mb-4">Ingresa tu nueva contraseña para acceder a TENNISSEL.</p>

            <form action="{{ url_for('reset_password', token=token) }}" method="POST">
                <div class="mb-3">
                    <label for="password" class="form-label text-light small">Nueva Contraseña</label>
                    <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" required placeholder="••••••••" minlength="6">
                </div>
                <button type="submit" class="btn-primary-custom mt-3">Cambiar Contraseña</button>
            </form>
        </div>
    </div>

    {% include 'footer.html' %}

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
