<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar inventario</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head><body>{% include 'navbar.html' %}<main class="container py-5 mt-5 text-light"><h1>{{ 'Editar' if producto else 'Nuevo' }} producto</h1><form method="post" class="card bg-dark border-secondary p-4"><div class="row g-3"><div class="col-md-6"><label>Nombre<input name="nombre" class="form-control" required value="{{ producto.nombre if producto else '' }}"></label></div><div class="col-md-6"><label>Marca<input name="marca" class="form-control" value="{{ producto.marca if producto else '' }}"></label></div><div class="col-md-6"><label>Descripción corta<input name="descripcion_corta" class="form-control" value="{{ producto.descripcion_corta if producto else '' }}"></label></div><div class="col-md-3"><label>Categoría<select name="categoria_id" class="form-select">{% for categoria in categorias %}<option value="{{ categoria.id }}" {% if producto and producto.categoria_id == categoria.id %}selected{% endif %}>{{ categoria.nombre }}</option>{% endfor %}</select></label></div><div class="col-md-3"><label>Precio<input type="number" step="0.01" name="precio" class="form-control" required value="{{ producto.precio if producto else 0 }}"></label></div><div class="col-md-3"><label>Stock<input type="number" name="stock" class="form-control" value="{{ producto.stock if producto else 0 }}"></label></div><div class="col-md-3"><label>SKU<input name="sku" class="form-control" value="{{ producto.sku if producto else '' }}"></label></div><div class="col-md-3"><label><input type="checkbox" name="activo" {% if not producto or producto.activo %}checked{% endif %}> Activo</label></div><div class="col-md-3"><label><input type="checkbox" name="destacado" {% if producto and producto.destacado %}checked{% endif %}> Destacado</label></div></div><button class="btn btn-success mt-3">Guardar</button></form><a class="btn btn-link text-light" href="{{ url_for('admin_inventario') }}">Volver</a></main>{% include 'footer.html' %}</body></html>
