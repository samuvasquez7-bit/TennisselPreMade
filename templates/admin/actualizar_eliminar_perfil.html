<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfiles de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Cambia tu etiqueta link por esta: -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.1">
</head>
<body>

{% include 'navbar.html' %}




<div class="ts-admin-page">



    <h1 class="ts-admin-title">

        Actualizar Usuario

    </h1>





    <form method="POST"
          class="ts-admin-form-box">





        <label class="ts-admin-label">

            Nombre de Usuario

        </label>



        <input 
            type="text"
            name="username"
            class="ts-admin-input"
            value="{{ usuario.username }}"
            required>







        <label class="ts-admin-label">

            Correo Electrónico

        </label>




        <input 
            type="email"
            name="email"
            class="ts-admin-input"
            value="{{ usuario.email }}"
            required>








        <label class="ts-admin-label">

            Teléfono

        </label>




        <input 
            type="text"
            name="telefono"
            class="ts-admin-input"
            value="{{ usuario.telefono }}">








        <label class="ts-admin-label">

            Nueva Contraseña

        </label>




        <input 
            type="password"
            name="password"
            class="ts-admin-input"
            placeholder="Dejar vacío para mantener la actual">







        <label class="ts-admin-label">

            Rol del Usuario

        </label>




        <select name="rol"
                class="ts-admin-select">



            <option value="cliente"
            {% if usuario.rol == 'cliente' %}
                selected
            {% endif %}>

                Cliente

            </option>




            <option value="admin"
            {% if usuario.rol == 'admin' %}
                selected
            {% endif %}>

                Administrador

            </option>





            <option value="visita"
            {% if usuario.rol == 'visita' %}
                selected
            {% endif %}>

                Visita

            </option>



        </select>








        <button type="submit"
                class="ts-admin-btn-save">


            Guardar Cambios


        </button>






        <a href="{{ url_for('admin_perfiles') }}"
           class="ts-admin-back">


            ← Volver a usuarios


        </a>





    </form>





</div>






{% include 'footer.html' %}
{% include 'javascript.html' %}





</body>


</html>
