<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesar Pago | TENNISSEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.1">
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Montserrat', sans-serif; }
        .pago-page { padding: 60px 0; }
        .pago-container { max-width: 650px; margin: 0 auto; padding: 0 20px; }
        .pago-panel { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .pago-header { margin-bottom: 25px; text-align: center; }
        .pago-header h1 span { color: #00ff66; }
        
        /* Opciones de pago estilizadas */
        .opciones-pago { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .opcion-card {
            display: flex; align-items: center; background: #222; padding: 15px 20px;
            border-radius: 8px; border: 1px solid #333; cursor: pointer; transition: 0.2s;
        }
        .opcion-card:hover { border-color: #00ff66; background: #282828; }
        .opcion-card input { margin-right: 15px; accent-color: #00ff66; transform: scale(1.3); cursor: pointer; }
        .opcion-detalle { display: flex; align-items: center; gap: 15px; width: 100%; }
        .opcion-detalle i { font-size: 24px; color: #00ff66; width: 30px; text-align: center; }
        .opcion-detalle small { display: block; color: #888; font-size: 12px; }
        
        .btn-pagar-ahora {
            width: 100%; background: #00ff66; color: #000; font-weight: bold; border: none; 
            padding: 14px; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 20px; transition: 0.2s;
        }
        .btn-pagar-ahora:hover { background: #00cc52; }
    </style>
</head>
<body>

{% include 'navbar.html' %}

<main class="pago-page">
    <div class="pago-container">
        <div class="pago-panel">
            <div class="pago-header">
                <h1><i class="fas fa-lock" style="color: #00ff66;"></i> Selecciona tu <span>Método de Pago</span></h1>
                <p style="color: #aaa;">Elige cómo deseas completar la transacción de forma segura.</p>
            </div>

            <!-- El formulario apunta a la ruta de Python que procesa el pago -->
            <form action="{{ url_for('procesar_pago') }}" method="POST">
                <div class="opciones-pago">
                    <label class="opcion-card">
                        <input type="radio" name="metodo" value="tarjeta" checked>
                        <div class="opcion-detalle">
                            <i class="far fa-credit-card"></i>
                            <div>
                                <strong>Tarjeta de Crédito / Débito</strong>
                                <small>Visa, Mastercard, American Express</small>
                            </div>
                        </div>
                    </label>

                    <label class="opcion-card">
                        <input type="radio" name="metodo" value="nequi">
                        <div class="opcion-detalle">
                            <i class="fas fa-mobile-alt"></i>
                            <div>
                                <strong>Nequi</strong>
                                <small>Pago rápido desde tu celular</small>
                            </div>
                        </div>
                    </label>

                    <label class="opcion-card">
                        <input type="radio" name="metodo" value="daviplata">
                        <div class="opcion-detalle">
                            <i class="fas fa-wallet"></i>
                            <div>
                                <strong>DaviPlata</strong>
                                <small>Billetera móvil segura</small>
                            </div>
                        </div>
                    </label>

                    <label class="opcion-card">
                        <input type="radio" name="metodo" value="transferencia">
                        <div class="opcion-detalle">
                            <i class="fas fa-university"></i>
                            <div>
                                <strong>Transferencia Bancaria (PSE)</strong>
                                <small>Débito directo de tu cuenta bancaria</small>
                            </div>
                        </div>
                    </label>

                    <label class="opcion-card">
                        <input type="radio" name="metodo" value="efecty">
                        <div class="opcion-detalle">
                            <i class="fas fa-store"></i>
                            <div>
                                <strong>Efecty</strong>
                                <small>Pago en efectivo en puntos autorizados</small>
                            </div>
                        </div>
                    </label>

                    <label class="opcion-card">
                        <input type="radio" name="metodo" value="paypal">
                        <div class="opcion-detalle">
                            <i class="fab fa-paypal"></i>
                            <div>
                                <strong>PayPal</strong>
                                <small>Pago internacional o saldo digital</small>
                            </div>
                        </div>
                    </label>
                </div>

                <button type="submit" class="btn-pagar-ahora">
                    <i class="fas fa-check-circle me-2"></i> Pagar y Confirmar Orden
                </button>
            </form>
        </div>
    </div>
</main>

{% include 'footer.html' %}
</body>
</html>
