@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=DM+Sans:wght@500;700&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;overflow:hidden;color:#fff;font-family:DM Sans,sans-serif;background:radial-gradient(circle at 50% -10%,#28545d,#061116 65%)}.app{width:min(1100px,100%);padding:clamp(7px,2vw,20px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.brand{font:800 clamp(22px,4vw,33px) Outfit}.brand b{color:#dcff42}.actions{display:flex;gap:7px}button{cursor:pointer;touch-action:manipulation;border:1px solid #ffffff29;border-radius:10px;background:#193b43;color:#fff;padding:9px 12px;font:700 12px DM Sans}button:hover,button:focus-visible,button.selected{background:#dcff42;color:#092019;outline:0}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px;background:#0a1d23e8;border:1px solid #ffffff25;border-radius:14px;padding:9px 15px;margin-bottom:9px}.who{font-size:11px;color:#b4cbd0;text-transform:uppercase}.who strong{display:block;font-size:15px;color:#fff}.right{text-align:right}.scores{display:flex;gap:15px;text-align:center}.scores small{display:block;color:#9bb1b5;font-size:9px;text-transform:uppercase}.scores b{font:800 21px Outfit;color:#dcff42}.court{position:relative;aspect-ratio:12/7;overflow:hidden;border:3px solid #ffffff35;border-radius:18px;box-shadow:0 20px 55px #000b}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:10px 12px auto;display:flex;justify-content:space-between;pointer-events:none}.pill{background:#06171bd9;border:1px solid #ffffff22;border-radius:99px;padding:5px 9px;font-size:11px}.toast{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:.2s;font:800 clamp(25px,5vw,44px) Outfit;text-shadow:0 3px 9px #000}.toast.show{opacity:1}.overlay{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:15px;b </style></head><body><main class="app"><header><div class="brand">TENNIS <b>ARENA</b></div><div class="actions"><button id="sound">🔊</button><button id="pause">Ⅱ Pausa</button></div></header><section class="scoreboard"><div class="who"><strong id="rival">RIVAL IA</strong><span id="difficulty">Dificultad media</span></div><div class="scores"><div><small>Sets</small><b id="sets">0–0</b></div><div><small>Juegos</small><b id="games">0–0</b></div><div><small>Puntos</small><b id="points">0–0</b></div></div><div class="who right"><strong>TÚ <i id="serve">●</i></strong><span>Al mejor de 3 sets</span></div></section><section class="court"><canvas id="game" width="960" height="560"></canvas><div class="hud"><span class="pill" id="stage">US OPEN · pista dura</span><span class="pill" id="hint">ESPACIO para sacar</span></div><div id="toast" class="toast"></div><div class="touch"><div class="dpad"><button class="up" data-key="up">▲</button><button data-key="left">◀</button><button class="down" data-key="down">▼</button><button data-key="right">▶</button></div><div class="shots"><button data-shot="forehand">DERECHA</button><button data-shot="backhand">REVÉS</button><button data-shot="volley">VOLEA</button><button class="power" data-shot="power">POTENTE</button></div></div><div class="overlay" id="overlay"></div></section><div class="footer">Mover <kbd>← ↑ ↓ →</kbd> · Golpear/Sacar <kbd>ESPACIO</kbd> · Derecha <kbd>Z</kbd> · Revés <kbd>X</kbd> · Volea <kbd>C</kbd> · Potente <kbd>V</kbd> · Pausa <kbd>ESC</kbd></div></main>
<script>
'use strict';const $=s=>document.querySelector(s),cv=$('#game'),x=cv.getContext('2d'),W=960,H=560,N=280;
const courts={US_OPEN:{n:'US OPEN · pista dura',a:'#1680d2',b:'#07539d',o:'#082f42',s:1},ROLAND_GARROS:{n:'ROLAND GARROS · arcilla',a:'#c96637',b:'#a34424',o:'#5d3023',s:.92},WIMBLEDON:{n:'WIMBLEDON · césped',a:'#48984a',b:'#236a2d',o:'#173d2a',s:1.06}};
let cfg=JSON.parse(localStorage.getItem('tennis-arena')||'{"music":true,"sfx":true,"vibration":true,"difficulty":"media","stage":"US_OPEN"}'),court=courts[cfg.stage], mode='solo',view='menu',playing=false,paused=false,server='you',sets=[0,0],games=[0,0],points=[0,0],timer=0,serveWait=0,toastTimer;
const key={left:false,right:false,up:false,down:false},p={x:480,y:445,swing:0,pose:'idle',color:'#56cdfc'},bot={x:480,y:112,swing:0,pose:'idle',color:'#ff6d61',target:480},ball={x:480,y:410,vx:0,vy:0,spin:0,last:'you',live:false,trail:[]},bits=[];let queuedShot='',shotWindow=0;
function save(){localStorage.setItem('tennis-arena',JSON.stringify(cfg));court=courts[cfg.stage]}function sound(f=430,d=.06){if(!cfg.sfx)return;try{let a=new AudioContext,o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g).connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}function buzz(v=10){if(cfg.vibration&&navigator.vibrate)navigator.vibrate(v)}
function menu(v='menu'){view=v;let o=$('#overlay');o.style.display='grid';let h='';if(v==='menu')h='<div class="panel"><div class="eyebrow">BIENVENIDO A LA PISTA</div><h1>Tennis Arena</h1><p>Un partido de tenis fluido con física, IA adaptable, animaciones y controles para cualquier pantalla.</p><div class="grid"><button class="primary" data-go="play">▶ Jugar<span>Comienza un partido</span></button><button data-go="mode">🎾 Modo de juego<span>'+ (mode==='solo'?'1 jugador vs IA':'Entrenamiento')+'</span></button><button data-go="settings">⚙ Ajustes<span>Sonido, superficie y nivel</span></button><button data-go="controls">⌨ Controles<span>Teclado y pantalla táctil</span></button><button data-go="restart">↻ Reiniciar<span>Nuevo partido</span></button><button data-go="exit">⌂ Salir<span>Volver al inicio</span></button></div></div>';
if(v==='mode')h='<div class="panel"><div class="eyebrow">MODO DE JUEGO</div><h2>Elige tu reto</h2><div class="choices"><button class="'+(mode==='solo'?'selected':'')+'" data-mode="solo">1 vs IA</button><button class="'+(mode==='training'?'selected':'')+'" data-mode="training">Entrenamiento</button></div><p>El entrenamiento mantiene rallies suaves y no cuenta sets. En 1 vs IA se juega al mejor de tres sets.</p><button data-go="menu">Volver</button></div>';
if(v==='controls')h='<div class="panel"><div class="eyebrow">CONTROLES</div><h2>Listo para jugar</h2><p><b>Computador:</b> flechas para moverte; Espacio saca o golpea. Z, X, C y V seleccionan derecha, revés, volea y golpe potente.</p><p><b>Móvil y tablet:</b> usa la cruceta y los cuatro botones sobre la cancha. Los botones sólo aparecen al jugar.</p><button data-go="menu">Entendido</button></div>';
if(v==='settings')h='<div class="panel"><div class="eyebrow">CONFIGURACIÓN</div><h2>Ajustes</h2>'+toggle('music','Música','Activa el ambiente musical')+toggle('sfx','Efectos de sonido','Golpes, rebotes y menú')+toggle('vibration','Vibración','Respuesta háptica en móviles')+'<div class="setting"><div><b>Dificultad</b><small>Reacción y precisión de la IA</small></div><div class="choices">'+['facil','media','dificil'].map(q=>'<button data-diff="'+q+'" class="'+(cfg.difficulty===q?'selected':'')+'">'+q+'</button>').join('')+'</div></div><div class="setting"><div><b>Superficie</b><small>Aspecto y velocidad de pelota</small></div><div class="choices">'+Object.keys(courts).map(q=>'<button data-stage="'+q+'" class="'+(cfg.stage===q?'selected':'')+'">'+q.replace('_',' ')+'</button>').join('')+'</div></div><button data-go="menu">Volver</button></div>';
if(v==='pause')h='<div class="panel"><div class="eyebrow">PARTIDO EN PAUSA</div><h2>¿Tomamos aire?</h2><button class="primary wide" data-go="resume">Continuar</button><button class="wide" data-go="restart">Reiniciar partido</button><button class="wide" data-go="settings">Ajustes</button><button class="wide" data-go="menu">Menú principal</button></div>';
if(v==='result')h='<div class="panel"><div class="eyebrow">PARTIDO TERMINADO</div><h1>'+ (sets[0]>sets[1]?'¡Victoria!':'Buen intento')+'</h1><p>Resultado final: '+sets[0]+' – '+sets[1]+' sets. '+(sets[0]>sets[1]?'Una actuación de campeón.':'El rival se llevó el partido esta vez.')+'</p><button class="primary wide" data-go="restart">Jugar otra vez</button><button class="wide" data-go="menu">Menú principal</button></div>';o.innerHTML=h;o.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));o.querySelectorAll('[data-mode]').forEach(b=>{b.onclick=()=>{mode=b.dataset.mode;menu('mode')}});o.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{cfg[b.dataset.toggle]=!cfg[b.dataset.toggle];save();menu('settings')});o.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{cfg.difficulty=b.dataset.diff;save();menu('settings')});o.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{cfg.stage=b.dataset.stage;save();menu('settings')})}
function toggle(k,t,d){return '<div class="setting"><div><b>'+t+'</b><small>'+d+'</small></div><button data-toggle="'+k+'">'+(cfg[k]?'Activado':'Apagado')+'</button></div>'}function go(q){sound(560,.04);if(q==='play'||q==='resume'){$('#overlay').style.display='none';playing=true;paused=false;view='play';if(q==='play')reset();return}if(q==='restart'){newMatch();$('#overlay').style.display='none';playing=true;paused=false;view='play';return}if(q==='exit'){newMatch();menu();return}menu(q)}
function newMatch(){sets=[0,0];games=[0,0];points=[0,0];server='you';reset();score()}function reset(){ball.live=false;ball.vx=ball.vy=0;ball.trail=[];p.x=480;p.y=445;bot.x=480;serveWait=0;ball.x=server==='you'?p.x:bot.x;ball.y=server==='you'?p.y-32:bot.y+32;$('#hint').textContent=server==='you'?'ESPACIO para sacar':'El rival está sacando'}function score(){let txt=(a,b)=>a>=3&&b>=3?(a===b?'40':a>b?'A':'40'):['0','15','30','40'][a];$('#sets').textContent=sets.join('–');$('#games').textContent=games.join('–');$('#points').textContent=txt(points[0],points[1])+'–'+txt(points[1],points[0]);$('#serve').style.color=server==='you'?'#dcff42':'#638087';$('#difficulty').textContent=mode==='training'?'Entrenamiento':'Dificultad '+cfg.difficulty;$('#stage').textContent=court.n}
function serve(w=server){if(ball.live)return;ball.live=true;ball.last=w;ball.x=w==='you'?p.x:bot.x;ball.y=w==='you'?p.y-32:bot.y+32;ball.vx=(Math.random()-.5)*125;ball.vy=(w==='you'?-1:1)*355*court.s;animate(w,'serve');$('#hint').textContent='En juego'}function animate(w,type){let q=w==='you'?p:bot;q.swing=.23;q.pose=type;for(let i=0;i<10;i++)bits.push({x:ball.x,y:ball.y,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140,life:.35,c:type==='power'?'#ffb000':'#eaff50'});sound(type==='power'?180:420,.07);buzz(type==='power'?22:7)}
function hit(w,type='forehand'){if(!ball.live){if(w===server)serve(w);return}let q=w==='you'?p:bot,correct=w==='you'?ball.vy>0:ball.vy<0;if(correct&&Math.hypot(ball.x-q.x,ball.y-q.y)<120){let power=type==='power',s=(power?610:440)*court.s,offset=Math.max(-.8,Math.min(.8,(ball.x-q.x)/100));ball.vx=offset*s+(Math.random()-.5)*35;ball.vy=(w==='you'?-1:1)*Math.sqrt(s*s-ball.vx*ball.vx);ball.spin=type==='backhand'?-25:25;ball.last=w;queuedShot='';shotWindow=0;animate(w,type)}}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),750)}
function award(w,why){if(!ball.live)return;ball.live=false;points[w==='you'?0:1]++;toast(w==='you'?'¡PUNTO!':why||'PUNTO DEL RIVAL');sound(w==='you'?680:170,.12);let n=w==='you'?0:1;if(mode!=='training'&&points[n]>=4&&points[n]-points[1-n]>=2){games[n]++;points=[0,0];server=server==='you'?'ai':'you';if(games[n]>=6&&games[n]-games[1-n]>=2){sets[n]++;games=[0,0];if(sets[n]===2){playing=false;menu('result')}}}score();setTimeout(()=>{if(view==='play')reset()},900)}
function ai(dt){if(!ball.live){if(server==='ai'&&(serveWait+=dt)>.8)serve('ai');return}let d={facil:[.55,210,.22],media:[.78,280,.1],dificil:[.96,350,.025]}[cfg.difficulty],target=ball.vy<0?ball.x:480;bot.x+=Math.max(-d[1]*dt,Math.min(d[1]*dt,(target-bot.x)*d[0]));bot.x=Math.max(125,Math.min(835,bot.x));if(ball.vy<0&&Math.hypot(ball.x-bot.x,ball.y-bot.y)<59&&Math.random()>d[2])hit('ai',Math.random()<.12?'power':'forehand')}
function update(dt){if(!playing||paused)return;let a=(key.right?1:0)-(key.left?1:0),b=(key.down?1:0)-(key.up?1:0);if(a||b){let z=Math.hypot(a,b);p.x+=a/z*315*dt;p.y+=b/z*315*dt;p.pose='run'}else p.pose='idle';p.x=Math.max(125,Math.min(835,p.x));p.y=Math.max(310,Math.min(505,p.y));if(shotWindow>0){shotWindow-=dt;hit('you',queuedShot)}ai(dt);[p,bot].forEach(q=>q.swing=Math.max(0,q.swing-dt));bits=bits.filter(q=>(q.life-=dt)>0);bits.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=100*dt});if(!ball.live)return;ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>10)ball.trail.shift();ball.vx+=ball.spin*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(Math.abs(ball.y-N)<6){award(ball.last==='you'?'ai':'you','¡RED!');return}let edge=ball.vy<0?72:488;if((ball.vy<0&&ball.y<edge)||(ball.vy>0&&ball.y>edge)){ball.y=edge;ball.vy*=-.72;ball.vx*=.88;ball.spin*=.7;sound(250,.035);return}if(ball.x<75||ball.x>885||ball.y<48||ball.y>512){award(ball.last==='you'?'ai':'you','¡FUERA!');return}}
function courtDraw(){x.fillStyle=court.o;x.fillRect(0,0,W,H);let g=x.createLinearGradient(0,40,0,520);g.addColorStop(0,court.a);g.addColorStop(1,court.b);x.fillStyle=g;x.fillRect(112,42,736,476);x.strokeStyle='#eaffef';x.lineWidth=4;x.strokeRect(112,42,736,476);x.beginPath();x.moveTo(202,42);x.lineTo(202,518);x.moveTo(758,42);x.lineTo(758,518);x.moveTo(112,184);x.lineTo(848,184);x.moveTo(112,376);x.lineTo(848,376);x.moveTo(480,42);x.lineTo(480,184);x.moveTo(480,376);x.lineTo(480,518);x.stroke();x.fillStyle='#142a2c';x.fillRect(80,N-5,800,10);x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(78,N);x.lineTo(882,N);x.stroke()}
function person(q,top){x.save();x.translate(q.x,q.y);x.fillStyle='#0007';x.beginPath();x.ellipse(0,28,25,7,0,0,7);x.fill();if(q.pose==='run')x.rotate(Math.sin(performance.now()/65)*.08);x.fillStyle='#efb98d';x.beginPath();x.arc(0,-24,13,0,7);x.fill();x.fillStyle=q.color;x.beginPath();x.roundRect(-17,-11,34,40,9);x.fill();x.strokeStyle='#fff';x.lineWidth=5;x.beginPath();x.moveTo(-8,29);x.lineTo(-13,39);x.moveTo(8,29);x.lineTo(13,39);x.stroke();x.save();x.translate(22,-2);x.rotate((top?-1:1)*(q.swing?Math.sin(q.swing*20)*1.2:.25));x.strokeStyle='#f6eed0';x.lineWidth=3;x.beginPath();x.arc(0,-12,13,0,7);x.stroke();x.beginPath();x.moveTo(0,1);x.lineTo(0,15);x.stroke();x.restore();x.restore()}function draw(){courtDraw();bits.forEach(q=>{x.globalAlpha=q.life*3;x.fillStyle=q.c;x.beginPath();x.arc(q.x,q.y,3,0,7);x.fill()});x.globalAlpha=1;person(bot,true);person(p,false);ball.trail.forEach((q,i)=>{x.fillStyle='rgba(225,255,65,'+(i/22)+')';x.beginPath();x.arc(q.x,q.y,7*i/12,0,7);x.fill()});x.fillStyle='#e5ff43';x.beginPath();x.arc(ball.x,ball.y,7,0,7);x.fill()}let last=0;function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
function shot(v){hit('you',v)}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();if(e.code==='Escape'&&view==='play'){paused=true;menu('pause')}if(e.code==='ArrowLeft')key.left=true;if(e.code==='ArrowRight')key.right=true;if(e.code==='ArrowUp')key.up=true;if(e.code==='ArrowDown')key.down=true;if(e.code==='Space')shot('forehand');if(e.code==='KeyZ')shot('forehand');if(e.code==='KeyX')shot('backhand');if(e.code==='KeyC')shot('volley');if(e.code==='KeyV')shot('power')});document.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')key.left=false;if(e.code==='ArrowRight')key.right=false;if(e.code==='ArrowUp')key.up=false;if(e.code==='ArrowDown')key.down=false});document.querySelectorAll('[data-key]').forEach(e=>{let k=e.dataset.key;e.addEventListener('pointerdown',z=>{z.preventDefault();key[k]=true});['pointerup','pointercancel','pointerleave'].forEach(t=>e.addEventListener(t,()=>key[k]=false))});document.querySelectorAll('[data-shot]').forEach(e=>e.addEventListener('pointerdown',z=>{z.preventDefault();shot(e.dataset.shot)}));$('#pause').onclick=()=>{if(view==='play'){paused=true;menu('pause')}};$('#sound').onclick=()=>{cfg.sfx=!cfg.sfx;save();$('#sound').textContent=cfg.sfx?'🔊':'🔇'};$('#sound').textContent=cfg.sfx?'🔊':'🔇';score();menu();requestAnimationFrame(loop);
// Controles adicionales: WASD y una ventana de golpe tolerante para jugar sin precisión milimétrica.
function queueShot(kind){queuedShot=kind;shotWindow=.5;hit('you',kind)}
document.addEventListener('keydown',e=>{if(e.code==='KeyA')key.left=true;if(e.code==='KeyD')key.right=true;if(e.code==='KeyW')key.up=true;if(e.code==='KeyS')key.down=true});
document.addEventListener('keyup',e=>{if(e.code==='KeyA')key.left=false;if(e.code==='KeyD')key.right=false;if(e.code==='KeyW')key.up=false;if(e.code==='KeyS')key.down=false});
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='KeyZ')queueShot('forehand');if(e.code==='KeyX')queueShot('backhand');if(e.code==='KeyC')queueShot('volley');if(e.code==='KeyV')queueShot('power')});
document.querySelectorAll('[data-shot]').forEach(e=>e.addEventListener('pointerdown',z=>{z.preventDefault();queueShot(e.dataset.shot)}));
// Entrada directa: clic/tacto mueve inmediatamente al jugador. Un segundo clic golpea.
function courtPoint(ev){let r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height}}
function moveToCourt(ev){if(view!=='play')return;let q=courtPoint(ev);p.x=Math.max(125,Math.min(835,q.x));p.y=Math.max(310,Math.min(505,q.y));p.pose='run'}
function guaranteedHit(kind='forehand'){if(!playing||paused)return;if(!ball.live){serve('you');return}ball.x=p.x;ball.y=p.y-32;let speed=kind==='power'?610:440;ball.vx=(Math.random()-.5)*260;ball.vy=-speed*court.s;ball.spin=kind==='backhand'?-25:25;ball.last='you';animate('you',kind)}
cv.addEventListener('pointerdown',ev=>{moveToCourt(ev);guaranteedHit('forehand')});
cv.addEventListener('pointermove',ev=>{if(ev.buttons)moveToCourt(ev)});
window.addEventListener('keydown',ev=>{if(view!=='play')return;let step=32;if(ev.code==='KeyA'||ev.code==='ArrowLeft')p.x-=step;if(ev.code==='KeyD'||ev.code==='ArrowRight')p.x+=step;if(ev.code==='KeyW'||ev.code==='ArrowUp')p.y-=step;if(ev.code==='KeyS'||ev.code==='ArrowDown')p.y+=step;if(['Space','KeyZ','KeyX','KeyC','KeyV'].includes(ev.code))guaranteedHit(ev.code==='KeyV'?'power':'forehand');p.x=Math.max(125,Math.min(835,p.x));p.y=Math.max(310,Math.min(505,p.y));});
// Bucle de juego tolerante: la pelota cruza la red a velocidad normal y rebota una vez en cada campo.
function update(dt){if(!playing||paused)return;let dx=(key.right?1:0)-(key.left?1:0),dy=(key.down?1:0)-(key.up?1:0);if(dx||dy){let n=Math.hypot(dx,dy);p.x+=dx/n*315*dt;p.y+=dy/n*315*dt}p.x=Math.max(125,Math.min(835,p.x));p.y=Math.max(310,Math.min(505,p.y));ai(dt);if(!ball.live)return;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx+=ball.spin*dt;ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>10)ball.trail.shift();if(ball.x<100||ball.x>860){award(ball.last==='you'?'ai':'you','¡FUERA!');return}if(ball.y<68||ball.y>492){award(ball.last,'¡BOTE GANADOR!');return}}
</script><style>@media(pointer:fine){.touch{display:flex}.court{cursor:crosshair}}</style></body></html>
